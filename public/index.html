<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Polyglots Academy</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Firebase SDK (Compat Version ) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="screen active">
        <div class="login-container">
            <img src="academy_logo.png" alt="Logo" class="login-logo">
            <h2>Welcome Back</h2>
            <form id="login-form">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" placeholder="Username" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                <div class="remember-me">
                    <input type="checkbox" id="remember">
                    <label for="remember">Remember Me</label>
                </div>
                <button type="submit" id="login-btn">Login</button>
            </form>
            <div id="login-error" class="error-message"></div>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="app-container" class="screen">
        <div class="top-bar">
            <button id="sidebar-toggle" class="hamburger-btn">☰</button>
            <div class="top-bar-center" style="font-size: 12px; font-weight: bold; color: var(--navy-color, #333); font-family: 'Cairo', sans-serif; display: flex; align-items: center; gap: 5px; text-align: center; padding: 0 10px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;">
                <span>لا_تنسى_غزة_و_السودان_المقاطعة_مستمرة</span>
                <span>🇵🇸🇸🇩</span>
            </div>
            <div class="top-bar-right" style="display: flex; align-items: center; gap: 12px;">
                <span id="user-points-badge" onclick="switchView('leaderboard')" style="background: #fff8e1; color: #f57c00; padding: 4px 10px; border-radius: 15px; font-weight: bold; font-size: 13px; display: flex; align-items: center; gap: 4px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.1);" title="لوحة الشرف">⭐ <span id="user-points-val">0</span> XP</span>
                <span id="user-mascot" onclick="openMascotModal( )" style="font-size: 22px; cursor: pointer; background: #f0f0f0; border-radius: 50%; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">👤</span>
                <div id="notification-bell" class="bell-container">
                    <i class="fas fa-bell"></i>
                    <span id="notification-badge" class="badge"></span>
                </div>
            </div>
        </div>

        <nav id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <img src="academy_logo.png" alt="Logo" class="sidebar-logo">
            </div>
            <ul class="sidebar-links">
                <li class="nav-item active" data-view="words">
                    <i class="fas fa-book"></i>
                    <span>Words</span>
                </li>
                <li class="nav-item" data-view="stories">
                    <i class="fas fa-book-open"></i>
                    <span>Stories</span>
                </li>
                <li class="nav-item" data-view="quizzes">
                    <i class="fas fa-vial"></i>
                    <span>Quizzes</span>
                </li>
                <li class="nav-item" data-view="chat">
                    <i class="fas fa-comments"></i>
                    <span>Polyglots AI</span>
                </li>

                <li class="nav-item" data-view="pronunciation">
                    <i class="fas fa-volume-up"></i>
                    <span>Pronunciation</span>
                </li>
                <li class="nav-item" data-view="games">
                    <i class="fas fa-gamepad"></i>
                    <span>Games</span>
                </li>
                <li class="nav-item" data-view="messages">
                    <i class="fas fa-envelope"></i>
                    <span>Messages</span>
                </li>
                <li class="nav-item" data-view="leaderboard">
                    <i class="fas fa-trophy"></i>
                    <span>لوحة الشرف</span>
                </li>
            </ul>
        </nav>

        <div id="search-bar-container" class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="Search in German or Arabic...">
        </div>

        <main id="main-content">
            <!-- Content will be injected here -->
            <div id="messages-section" class="view-section"></div>
        </main>

        <footer>
            <div class="footer-content">
                <p>Polyglots Academy - 15 May city</p>
                <div class="social-links">
                    <a href="https://wa.me/201152535924" target="_blank"><i class="fab fa-whatsapp"></i></a>
                    <a href="https://www.facebook.com/profile.php?id=100075621807287" target="_blank"><i class="fab fa-facebook"></i></a>
                    <a href="https://www.tiktok.com/@polygotsacademy26" target="_blank"><i class="fab fa-tiktok"></i></a>
                </div>
            </div>
        </footer>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>
    <span id="record-timer" style="display:none; color:red; font-weight:bold; margin: 0 10px;">00:00</span>

    <!-- Image Lightbox Modal -->
    <div id="image-lightbox" class="modal" onclick="closeLightbox( )">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="lightbox-img">
    </div>

    <!-- Google Drive Preview Modal -->
    <div id="drive-modal" class="modal">
        <div class="modal-content drive-content">
            <span class="close-modal" onclick="closeDriveModal()">&times;</span>
            <iframe id="drive-iframe" src="" frameborder="0"></iframe>
        </div>
    </div>

    <!-- Delete Message Prompt Modal -->
    <div id="delete-modal" class="modal">
        <div class="modal-content delete-prompt">
            <h3>مسح الرسالة؟</h3>
            <button onclick="confirmDelete('me')" class="delete-btn-option">مسح لي فقط</button>
            <button id="delete-everyone-btn" onclick="confirmDelete('everyone')" class="delete-btn-option everyone">مسح للجميع</button>
            <button onclick="closeDeleteModal()" class="delete-btn-option cancel">إلغاء</button>
        </div>
    </div>

    <!-- Mascot Selection Modal -->
    <div id="mascot-modal" class="modal">
        <div class="modal-content mascot-content">
            <h3 style="text-align: center; margin-top: 0; margin-bottom: 15px; font-family: 'Cairo', sans-serif; color: var(--navy-color);">اختر شخصيتك</h3>
            <div id="mascot-grid" class="mascot-grid"></div>
            <button onclick="closeMascotModal()" style="display: block; width: 100%; padding: 10px; margin-top: 15px; background: #eee; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-family: 'Cairo', sans-serif; color: #333;">إغلاق</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
