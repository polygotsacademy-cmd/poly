<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Polyglots Academy</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Hamburger Menu Button -->
    <button id="sidebar-toggle" class="hamburger-btn">
        <i class="fas fa-bars"></i>
    </button>

    <!-- Sidebar Navigation -->
    <nav id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <img src="academy_logo.png" alt="Logo" class="sidebar-logo">
            <button id="sidebar-close" class="sidebar-close-btn"><i class="fas fa-times"></i></button>
        </div>
        <div class="sidebar-nav-list">
            <div class="nav-item active" data-view="words">
                <i class="fas fa-book"></i>
                <span>Words</span>
            </div>
            <div class="nav-item" data-view="stories">
                <i class="fas fa-book-open"></i>
                <span>Stories</span>
            </div>
            <div class="nav-item" data-view="quizzes">
                <i class="fas fa-vial"></i>
                <span>Quizzes</span>
            </div>
            <div class="nav-item" data-view="materials">
                <i class="fas fa-file-alt"></i>
                <span>Materials</span>
            </div>
            <div class="nav-item" data-view="messages">
                <i class="fas fa-envelope"></i>
                <span>Messages</span>
            </div>
            <div class="nav-item" data-view="pronunciation">
                <i class="fas fa-volume-up"></i>
                <span>Pronunciation</span>
            </div>
            <div class="nav-item" data-view="chat">
                <i class="fas fa-comments"></i>
                <span>AI Chat</span>
            </div>
            <div class="nav-item" data-view="games">
                <i class="fas fa-gamepad"></i>
                <span>Games</span>
            </div>
        </div>
        <div class="sidebar-footer">
            <p>Polyglots Academy</p>
        </div>
    </nav>

    <!-- Overlay for mobile sidebar -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Login Screen -->
    <div id="login-screen" class="screen active">
        <div class="login-container">
            <img src="academy_logo.png" alt="Logo" class="login-logo">
            <h2>Welcome Back</h2>
            <form id="login-form">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" placeholder="Username" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                <div class="remember-me">
                    <input type="checkbox" id="remember">
                    <label for="remember">Remember Me</label>
                </div>
                <button type="submit" id="login-btn">Login</button>
            </form>
            <div id="login-error" class="error-message"></div>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="app-container" class="screen">
        <header class="main-header">
            <div id="search-bar-container" class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="Search in German or Arabic...">
            </div>
        </header>

        <main id="main-content">
            <!-- Content will be injected here -->
        </main>

        <footer>
            <div class="footer-content">
                <p>Polyglots Academy - 15 May city</p>
                <div class="social-links">
                    <a href="https://wa.me/201152535924" target="_blank"><i class="fab fa-whatsapp"></i></a>
                    <a href="https://www.facebook.com/profile.php?id=100075621807287" target="_blank"><i class="fab fa-facebook"></i></a>
                    <a href="https://www.tiktok.com/@polygotsacademy26" target="_blank"><i class="fab fa-tiktok"></i></a>
                </div>
            </div>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
